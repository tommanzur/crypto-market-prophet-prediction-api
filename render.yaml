services:
  - type: web
    name: crypto-market-prophet-prediction-api
    env: python
    buildCommand: pip install -r requirements.txt && python -c "import cmdstanpy; cmdstanpy.install_cmdstan(version='2.34.1')"
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
