services:
  - type: web
    name: crypto-market-prophet-prediction-api
    env: python
    buildCommand: pip install -r requirements.txt && python -c "import importlib.resources as ir; import cmdstanpy; cmdstanpy.install_cmdstan(dir=str(ir.files('prophet')/'stan_model'), version='2.33.1')"
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
