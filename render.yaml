services:
  - type: web
    name: crypto-market-prophet-prediction-api
    env: python
    buildCommand: pip install -r requirements.txt && python src/install_cmdstan.py
    startCommand: cd src && uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
