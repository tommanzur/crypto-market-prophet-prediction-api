services:
  - type: web
    name: crypto-market-prophet-prediction-api
    env: python
    buildCommand: pip install -r src/requirements.txt && python -c "import cmdstanpy; cmdstanpy.install_cmdstan()"
    startCommand: python install_cmdstan.py && cd src && uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
